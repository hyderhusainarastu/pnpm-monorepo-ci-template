name: CI

# Self-check for this repo. The deployable template lives in templates/ci.yml
# and needs a real monorepo, so it is validated statically here, not run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -shellcheck= \
            -color .github/workflows/ci.yml templates/ci.yml

      - name: Sanity checks on templates/ci.yml
        run: |
          set -eu
          f=templates/ci.yml
          grep -q 'pgvector/pgvector' "$f"
          grep -q -- '--health-cmd pg_isready' "$f"
          grep -q 'node-version-file: ".node-version"' "$f"
          # pnpm/action-setup must come before actions/setup-node
          a=$(grep -n 'pnpm/action-setup' "$f" | head -1 | cut -d: -f1)
          b=$(grep -n 'actions/setup-node' "$f" | head -1 | cut -d: -f1)
          [ "$a" -lt "$b" ] || { echo "pnpm/action-setup must precede setup-node"; exit 1; }
          test -f examples/.node-version
          test -f examples/pnpm-workspace.yaml
          test -f examples/package.json
