name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://app:app_ci_only@localhost:5432/app_ci
  DIRECT_URL: postgres://app:app_ci_only@localhost:5432/app_ci
  AUTH_SECRET: ci-only-not-a-real-secret-do-not-reuse
  AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # Dummy object-storage values so @acme/ingestion's storage client constructs
  # at import time (the CI-safe E2E specs never actually hit storage; teardown
  # storage deletes are best-effort and swallowed).
  STORAGE_URL: http://localhost:54321
  STORAGE_SERVICE_ROLE_KEY: ci-only-dummy-service-role-key
  STORAGE_BUCKET: uploads

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_ci_only
          POSTGRES_DB: app_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node: its packageManager-based caching tries to
      # invoke pnpm to compute a cache key, so pnpm needs to already be on
      # PATH before that step runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @acme/db db:migrate

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm --filter web build

      # E2E: only the specs that need web + Postgres (no worker, no live
      # third-party APIs) run in CI — landing/onboarding (accessibility), the
      # authorization matrix, and a handful of other DB-seeded UI flows.
      # Everything that seeds its own data directly needs no worker, no
      # background job processor, and no external API spend. Specs that
      # exercise a background worker, object storage, or live third-party
      # APIs (search/AI/bibliographic-style providers, etc.) still run
      # manually against the full local stack — see the README for the full
      # reasoning behind this split.
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (CI-safe specs)
        # FEATURE_PIPELINE_VERSION pins the code path these CI-safe specs are
        # written against, matching what local dev and production actually
        # run. Without it, some environments fall back to an older default
        # pipeline version and a route this suite drives can start rejecting
        # requests it expects to succeed. Scoped to this step only; the
        # unit-test step keeps the unset-default behavior its own config
        # tests exercise explicitly.
        #
        # FEATURE_FLAG_EXAMPLE: one spec drives a real feature-gated HTTP
        # route directly, not just its UI shell. Without this flag, the
        # gate defaults closed and that route 404s before the test's own
        # assertions ever run. No third-party API key is configured in CI,
        # so any AI/search-backed logic that route touches falls back to a
        # deterministic, zero-cost path — this stays fully deterministic,
        # it just needed the gate open. This does not enable any other
        # feature flag: specs that need those remain excluded from the
        # CI-safe spec list below and continue to self-skip via their own
        # `test.skip(process.env.FEATURE_..._ENABLED !== "true", ...)`
        # guards.
        env:
          FEATURE_PIPELINE_VERSION: v2
          FEATURE_FLAG_EXAMPLE: "true"
        run: |
          pnpm --filter web start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 2
          done
          pnpm --filter web exec playwright test landing.spec.ts onboarding.spec.ts security.spec.ts dashboard.spec.ts settings.spec.ts workspace.spec.ts auth.spec.ts status.spec.ts
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
